<!DOCTYPE html>
<html>
<head>
    <title>{{ blog.title }}</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .meta { color: #666; margin-bottom: 20px; }
        a { color: #2563eb; }
    </style>
</head>
<body>

    <a href="/blogs/">← Back to all blogs</a>

    <h1>{{ blog.title }}</h1>

    <p class="meta">
        By <strong>{{ blog.author }}</strong> | {{ blog.created_at|date:"F d, Y" }}
    </p>
       {% if blog.image %}
           <img src="{{ blog.image.url }}" style="max-width:400px; margin:20px 0;">
       {% endif %}
    <p>{{ blog.content }}</p>

    <!-- ✅ PUT IT HERE (below content) -->
    {% if request.user == blog.author %}
        <a href="{% url 'edit-blog' blog.id %}">Edit Blog</a>
    {% endif %}

</body>
</html>
