<!DOCTYPE html>
<html>
<head>
    <title>{{ blog.title }}</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .meta { color: #666; margin-bottom: 20px; }
        a { color: #2563eb; }
    </style>
</head>
<body>

    <a href="/blogs/">← Back to all blogs</a>
    <h1>{{ blog.title }}</h1>
    <p class="meta">By <strong>{{ blog.author }}</strong> | {{ blog.created_at|date:"F d, Y" }}</p>
    <p>{{ blog.content }}</p>

</body>
</html>
