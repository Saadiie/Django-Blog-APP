<!DOCTYPE html>
<html>
<head>
    <title>Create Blog</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 16px 0;
                          border: 1px solid #ddd; border-radius: 6px;
                          font-size: 15px; box-sizing: border-box; }
        textarea { height: 200px; resize: vertical; }
        button { background: #2563eb; color: white; padding: 12px 28px;
                 border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        a { color: #2563eb; }
    </style>
</head>
<body>

    <a href="/blogs/">← Back to all blogs</a>
    <h1>✍️ Create New Blog</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title</label>
        <input type="text" name="title" placeholder="Enter blog title" required>

        <label>Author</label>
        <input type="text" name="author" placeholder="Your name" required>

        <label>Content</label>
        <textarea name="content" placeholder="Write your blog here..." required></textarea>

        <button type="submit">Publish Blog</button>
    </form>

</body>
</html>
