<!DOCTYPE html>
<html>
<head>
    <title>All Blogs</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .blog-card { border: 1px solid #ddd; padding: 20px; margin: 15px 0; border-radius: 8px; }
        .blog-card h2 { margin: 0 0 8px 0; }
        a { color: #2563eb; text-decoration: none; }
        .btn { background: #2563eb; color: white; padding: 10px 20px;
               border-radius: 6px; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>📝 All Blog Posts</h1>
    <a href="/blogs/create/" class="btn">+ Create New Blog</a>

    {% if blogs %}
        {% for blog in blogs %}
            <div class="blog-card">
                <h2>{{ blog.title }}</h2>
                <p>By <strong>{{ blog.author }}</strong> | {{ blog.created_at|date:"M d, Y" }}</p>
                <p>{{ blog.content|truncatewords:20 }}</p>
                <a href="/blogs/{{ blog.id }}/">Read More →</a>
            </div>
        {% endfor %}
    {% else %}
        <p>No blogs yet. <a href="/blogs/create/">Create the first one!</a></p>
    {% endif %}

</body>
</html>
